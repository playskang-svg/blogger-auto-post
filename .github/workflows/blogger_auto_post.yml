name: Blogger Auto Posting with Gemini AI

on:
  schedule:
    # 매일 한국 시간 오전 9시 (UTC 00:00) 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      validate_only:
        description: '글을 발행하지 않고 Blogger/Gemini 인증만 점검'
        type: boolean
        default: true

jobs:
  auto_post:
    runs-on: ubuntu-latest

    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v3

    - name: Python 3.10 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Gemini AI 글 생성 및 Blogger 포스팅 실행
      env:
        BLOG_ID: ${{ secrets.BLOG_ID }}
        BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        VALIDATE_ONLY: ${{ inputs.validate_only || 'false' }}
      run: |
        python blogger_poster.py
