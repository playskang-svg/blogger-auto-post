name: Blogger Auto Posting

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  auto_post:
    runs-on: ubuntu-latest

    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v3

    - name: Python 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Blogger 포스팅 실행
      env:
        BLOG_ID: ${{ secrets.BLOG_ID }}
        BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
      run: |
        python blogger_poster.py
